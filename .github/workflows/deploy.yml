name: Deploy

"on":
  push:
    branches: [trip_planner.AI]
  workflow_dispatch: {} # needed for a no-code-change redeploy after infra/scripts/restore.sh

# Values below (repository Variables, not Secrets — none of them are
# sensitive) come from `terraform output` after `infra/environments/prod`
# has been applied. See infra/README.md for the full list and how to set
# them: Settings -> Secrets and variables -> Actions -> Variables.
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, ECS_CLUSTER,
#   ECS_SERVICE, ECS_TASK_FAMILY, ECS_PRIVATE_SUBNET_IDS (comma-separated),
#   ECS_SECURITY_GROUP_ID, API_BASE_URL

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel a deploy mid-rollout

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC token
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
            cut -d. -f2 | base64 -d | python3 -m json.tool

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  migrate:
    name: Run Alembic migration
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # One-off ECS task running `alembic upgrade head` against the new
      # image, ahead of the service update below — deliberately not run
      # in-container on every app start (see backend/entrypoint.sh and
      # specs_new/backend-spec.md §9), so a rolling deploy with several
      # tasks starting concurrently can't race the migration.
      - name: Run migration task and wait for it to finish
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -eu
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"backend\",\"image\":\"$IMAGE\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task exited with code $EXIT_CODE" >&2
            aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"
            exit 1
          fi

  deploy:
    name: Deploy to ECS
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register new task definition revision
        id: register
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -eu
          CURRENT=$(aws ecs describe-task-definition --task-definition "${{ vars.ECS_TASK_FAMILY }}")
          NEW_DEF=$(echo "$CURRENT" | jq --arg IMAGE "$IMAGE" '
            .taskDefinition
            | .containerDefinitions[0].image = $IMAGE
            | del(
                .taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy
              )
          ')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update service and wait for rollout
        run: |
          set -eu
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "${{ steps.register.outputs.task_def_arn }}" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - name: Health check
        run: |
          set -eu
          HEALTH_URL="${API_BASE_URL%/api/v1}/health"
          curl -fsS --retry 5 --retry-delay 5 "$HEALTH_URL"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
